services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pdfbolt-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - STORAGE_BACKEND=local
      - QUEUE_BACKEND=local
      - TEMP_DIR=/tmp/pdfbolt
    volumes:
      - pdfbolt-storage:/tmp/pdfbolt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pdfbolt-storage:
