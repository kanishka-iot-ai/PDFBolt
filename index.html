<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Free Online PDF Tools – Merge, Compress, Convert & Edit PDFs | PDFBolt</title>
  <meta name="description" id="seo-description"
    content="Use free online PDF tools to merge, compress, split, convert, edit and protect PDF files. Fast, private and easy-to-use PDF tools with PDFBolt.">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#eab308">
  <link rel="canonical" href="https://pdfbolt.in/" />

  <!-- OpenGraph Tags -->
  <meta property="og:title" content="Free Online PDF Tools – Merge, Compress, Convert & Edit PDFs | PDFBolt">
  <meta property="og:description"
    content="Use free online PDF tools to merge, compress, split, convert, edit and protect PDF files. Fast, private and easy-to-use PDF tools with PDFBolt.">
  <meta property="og:image" content="https://pdfbolt.in/pdfbolt-logo-transparent.png">
  <meta property="og:url" content="https://pdfbolt.in/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Free Online PDF Tools – Merge, Compress, Convert & Edit PDFs | PDFBolt">
  <meta name="twitter:description" content="Use free online PDF tools to merge, compress, split, convert, edit and protect PDF files. Fast, private and easy-to-use PDF tools with PDFBolt.">
  <meta name="twitter:image" content="https://pdfbolt.in/pdfbolt-logo-transparent.png">

  <link rel="modulepreload" href="/src/index.tsx">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      overflow-x: hidden;
    }

    .dark {
      background-color: #0f172a;
      color: #f8fafc;
    }

    .animate-fadeIn {
      animation: fadeIn 0.4s ease-out forwards;
    }

    .animate-fadeInUp {
      opacity: 0;
      animation: fadeInUp 0.5s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }
  </style>
</head>

<body class="transition-colors duration-300">
  <div id="root">
    <!-- Static content for search engines and users without JavaScript -->
    <noscript>
      <div style="padding: 40px; max-width: 800px; margin: 0 auto; font-family: system-ui, -apple-system, sans-serif;">
        <h1>PDFBolt - Lightning Fast PDF Tools</h1>
        <p>Merge, split, compress, protect, and convert PDFs without uploading to a server. 100% private and blazing
          fast.</p>
        <p><strong>Please enable JavaScript to use this application.</strong></p>
        <h2>Available Tools:</h2>
        <ul>
          <li>Merge PDF - Combine multiple PDFs into one</li>
          <li>Split PDF - Extract pages from your PDF</li>
          <li>Compress PDF - Reduce PDF file size</li>
          <li>PDF to QR Code - Generate QR codes from PDFs</li>
          <li>Sign PDF - Add digital signatures</li>
          <li>Protect PDF - Add password protection</li>
          <li>Convert PDF - PDF to Word, Excel, JPG and more</li>
        </ul>
      </div>
    </noscript>

    <!-- Loading fallback visible before React hydrates -->
    <div id="loading-fallback"
      style="display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;">
      <div style="text-align: center; padding: 20px;">
        <img src="/pdfbolt-logo.svg" alt="PDFBolt" width="160" height="40" style="height: 40px; width: 160px; margin: 0 auto 1.5rem auto; display: block;" />
        <p style="color: #64748b; margin-bottom: 2rem;">Lightning Fast PDF Tools</p>
        <div
          style="width: 40px; height: 40px; border: 3px solid #eab308; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;">
        </div>
        <p style="color: #94a3b8; font-size: 0.875rem; margin-top: 1rem;">Loading your privacy-first PDF toolkit...</p>
      </div>
    </div>
  </div>

  <!-- Structured Data for SEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "PDFBolt",
    "description": "Lightning-fast browser-based PDF toolkit. Merge, split, compress, protect, and convert PDFs without uploading to a server. 100% private and blazing fast.",
    "url": "https://pdfbolt.in",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "featureList": [
      "Merge PDF files",
      "Split PDF pages",
      "Compress PDF size",
      "Convert PDF to Word, Excel, JPG",
      "Add password protection",
      "Digital signature",
      "QR code generation",
      "100% client-side processing"
    ],
    "browserRequirements": "Requires JavaScript",
    "screenshot": "https://pdfbolt.in/pdfbolt-logo-transparent.png"
  }
  </script>

  <!-- Global Website & Searchbox Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "PDFBolt",
    "url": "https://pdfbolt.in/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://pdfbolt.in/?s={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Organization Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "PDFBolt",
    "url": "https://pdfbolt.in",
    "logo": "https://pdfbolt.in/pdfbolt-logo-transparent.png",
    "sameAs": []
  }
  </script>

  <style>
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #loading-fallback {
      transition: opacity 0.3s ease-out;
    }
  </style>

  <script type="module" src="/src/index.tsx"></script>

  <!-- Hide loading fallback once React loads -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const fallback = document.getElementById('loading-fallback');
        if (fallback) {
          fallback.style.opacity = '0';
          setTimeout(() => fallback.remove(), 300);
        }
      }, 100);
    });
  </script>


  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/service-worker.js')
          .then((registration) => {
            console.log('[PDFBolt] Service Worker registered successfully:', registration.scope);
          })
          .catch((error) => {
            console.log('[PDFBolt] Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>

</html>
