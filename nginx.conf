# 301 Domain Migration Block: Direct 1-hop redirect from legacy domain to https://pdfbolt.in
server {
    listen 80;
    server_name pdfbolt.com www.pdfbolt.com;
    return 301 https://pdfbolt.in$request_uri;
}

server {
    listen 80;
    server_name pdfbolt.in www.pdfbolt.in _;
    root /usr/share/nginx/html;
    index index.html;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/xml
        application/x-javascript
        image/svg+xml
        font/woff
        font/woff2;
    
    # Static Assets Caching
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # 301 Permanent SEO Redirects for Canonical URL Consolidation
    location = /merge { return 301 /merge-pdf; }
    location = /split { return 301 /split-pdf; }
    location = /compress { return 301 /compress-pdf; }
    location = /pdf-analyzer { return 301 /analyze-pdf; }
    location = /analyze { return 301 /analyze-pdf; }
    location = /tools/pdf-analyzer { return 301 /analyze-pdf; }
    location = /pdf-editor { return 301 /edit-pdf; }
    location = /edit { return 301 /edit-pdf; }
    location = /qr-pdf-share { return 301 /pdf-to-qr-code; }
    location = /pdf-to-qr { return 301 /pdf-to-qr-code; }
    location = /extract-pages { return 301 /split-pdf; }
    location = /extract-pdf-pages { return 301 /split-pdf; }
    location = /organize { return 301 /organize-pdf; }
    location = /reorder-pages { return 301 /organize-pdf; }
    location = /rotate { return 301 /rotate-pdf; }
    location = /watermark { return 301 /watermark-pdf; }
    location = /delete-pages { return 301 /delete-pdf-pages; }
    location = /page-numbers { return 301 /add-page-numbers-to-pdf; }
    location = /add-page-numbers { return 301 /add-page-numbers-to-pdf; }
    location = /protect { return 301 /protect-pdf; }
    location = /unlock { return 301 /unlock-pdf; }
    location = /sign { return 301 /sign-pdf; }
    location = /redact { return 301 /redact-pdf; }
    location = /repair { return 301 /repair-pdf; }
    location = /ocr { return 301 /ocr-pdf; }
    location = /scan-pdf { return 301 /scan-to-pdf; }
    location = /scan-handwriting { return 301 /scan-handwriting-to-pdf; }
    location = /compare { return 301 /compare-pdf; }
    location = /pdf-to-images { return 301 /pdf-to-jpg; }

    # Main Application (SPA)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Private API and Storage Endpoints (Anti-Indexing)
    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ =404;
    }

    location /storage/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ =404;
    }

    # Robots and Sitemap
    location = /robots.txt {
        add_header Content-Type text/plain;
    }
    
    location = /sitemap.xml {
        add_header Content-Type application/xml;
    }
    
    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
