<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFBolt Embeddable Widget Demo</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 40px 20px; background: #f8fafc; color: #0f172a;">

  <div style="max-width: 650px; margin: 0 auto; text-align: center;">
    <h1 style="font-size: 28px; font-weight: 800; color: #1e3a8a; margin-bottom: 8px;">PDFBolt Client Embeddable Tool</h1>
    <p style="font-size: 14px; opacity: 0.7; margin-bottom: 30px;">
      Drop-in widget with interactive tool dropdown menu. Select any tool and process files directly.
    </p>

    <!-- Multi-Tool Dropdown Widget -->
    <div data-pdfbolt-tool="dropdown" 
         data-pdfbolt-key="pdfbolt_live_demo" 
         data-pdfbolt-theme="light">
    </div>
  </div>

  <!-- The 1-Line PDFBolt SDK Engine -->
  <script src="/sdk/pdfbolt.js" async></script>
</body>
</html>
