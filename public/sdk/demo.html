<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFBolt Embeddable Widget Demo</title>
</head>
<body style="font-family: sans-serif; padding: 40px; background: #f1f5f9;">

  <div style="max-width: 600px; margin: 0 auto; text-align: center;">
    <h1>PDFBolt Embedded Tool Example</h1>
    <p>Drop this widget into any website, blog, or client portal with just 2 lines of code.</p>

    <!-- Drop-in Widget -->
    <div data-pdfbolt-tool="compress" 
         data-pdfbolt-key="DEMO_API_KEY" 
         data-pdfbolt-theme="light">
    </div>
  </div>

  <!-- The 1-Line PDFBolt SDK -->
  <script src="/sdk/pdfbolt.js" async></script>
</body>
</html>
