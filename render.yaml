# ==============================================================================
# Render Infrastructure Blueprint for PDFBolt Production Backend API
# ==============================================================================

services:
  - type: web
    name: pdfbolt-api
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: STORAGE_BACKEND
        value: gcs
      - key: GCS_PROJECT_ID
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_REGION
        value: us-central1
      - key: PUBSUB_TOPIC_JOBS
        value: pdfbolt-jobs
      - key: PUBSUB_SUBSCRIPTION_JOBS
        value: pdfbolt-jobs-sub
      - key: API_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://pdfbolt.com","https://www.pdfbolt.com","https://pdfbolt.in"]'
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "104857600"
      - key: PROCESSING_FILE_TTL_SECONDS
        value: "900"
      - key: HARD_SAFETY_TTL_SECONDS
        value: "1200"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "300"
      - key: SIGNED_URL_TTL_SECONDS
        value: "900"
