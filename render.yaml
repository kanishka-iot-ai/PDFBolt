        destination: /guides/jpg-ko-pdf-kaise-banaye/
      - type: redirect
        source: /pdf-builder
        destination: /analyze-pdf/
      - type: redirect
        source: /pdf-builder/
        destination: /analyze-pdf/
      - type: redirect
        source: /split-pdf-pages
        destination: /split-pdf/
      # Security Hardening: Explicit 404 rewrite for dotfiles & sensitive keys (Stops scanner 200 SPA fallback)
      - type: rewrite
        source: /.env*
        destination: /404.html
      - type: rewrite
        source: /.git/*
        destination: /404.html
      - type: rewrite
        source: /server.key
        destination: /404.html
      - type: rewrite
        source: /*.key
        destination: /404.html
      # Fallback SPA rewrite for dynamic routes
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://pagead2.googlesyndication.com https://adservice.google.com https://tpc.googlesyndication.com https://www.googletagmanager.com https://*.clarity.ms https://scripts.clarity.ms; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: https://*.google-analytics.com https://*.googlesyndication.com https://*.doubleclick.net https://*.clarity.ms https://*.bing.com; font-src 'self' data:; connect-src 'self' blob: data: https://pdfbolt.in https://www.pdfbolt.in https://pdfbolt-api.onrender.com https://generativelanguage.googleapis.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.adtrafficquality.google https://googleads.g.doubleclick.net https://*.doubleclick.net https://*.google.com https://*.clarity.ms https://*.bing.com; frame-src 'self' https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com https://pagead2.googlesyndication.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self';"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.png
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.ico
        name: Cache-Control
        value: public, max-age=86400
    envVars:
      - key: VITE_API_URL
        value: https://pdfbolt-api.onrender.com
      - key: VITE_API_BASE_URL
        value: https://pdfbolt-api.onrender.com
      - key: VITE_APP_ENV
        value: production
      - key: VITE_ADS_ENABLED
        value: "false"

  # ----------------------------------------------------------------------------
  # 2. Backend Processing Engine (FastAPI Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: pdfbolt-api
    env: docker
    dockerfilePath: ./Dockerfile.api
    region: oregon
    plan: free
    healthCheckPath: /health

    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: STORAGE_BACKEND
        value: local
      - key: CORS_ORIGINS
        value: '["https://pdfbolt.in","https://www.pdfbolt.in","https://pdfbolt.com","https://www.pdfbolt.com","https://pdfbolt.onrender.com","https://pdfbolt-web.onrender.com"]'
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "104857600"
      - key: PROCESSING_FILE_TTL_SECONDS
        value: "900"
      - key: HARD_SAFETY_TTL_SECONDS
        value: "1200"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "300"
      - key: SIGNED_URL_TTL_SECONDS
        value: "900"
      - key: RENDER_EXTERNAL_URL
        value: https://pdfbolt-api.onrender.com
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONMALLOC
        value: "malloc"
      - key: REQUIRE_API_KEY_FOR_EXTERNAL
        value: "true"
      - key: ADMIN_PORTAL_PASSWORD
        value: "Kkds@cuchd.in"
      - key: ADMIN_TOKEN_SECRET
        value: "pdfbolt_admin_hmac_secret_key_8849f2b901a"

