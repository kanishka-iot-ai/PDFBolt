# ==============================================================================
# Render Infrastructure Blueprint for PDFBolt Production
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Static Site (React / Vite)
  # ----------------------------------------------------------------------------
  - type: static
    name: pdfbolt-web
    repo: https://github.com/kanishka-iot-ai/PDFBolt.git
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pdfbolt-api.onrender.com
      - key: VITE_API_BASE_URL
        value: https://pdfbolt-api.onrender.com
      - key: VITE_APP_ENV
        value: production
      - key: VITE_ADS_ENABLED
        value: "false"

  # ----------------------------------------------------------------------------
  # 2. Backend Processing Engine (FastAPI)
  # ----------------------------------------------------------------------------
  - type: web
    name: pdfbolt-api
    repo: https://github.com/kanishka-iot-ai/PDFBolt.git
    branch: main
    env: docker
    dockerfilePath: ./Dockerfile.api
    region: oregon
    plan: standard
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: STORAGE_BACKEND
        value: local
      - key: CORS_ORIGINS
        value: '["https://pdfbolt.com","https://www.pdfbolt.com","https://pdfbolt.onrender.com","https://pdfbolt-web.onrender.com"]'
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "104857600"
      - key: PROCESSING_FILE_TTL_SECONDS
        value: "900"
      - key: HARD_SAFETY_TTL_SECONDS
        value: "1200"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "300"
      - key: SIGNED_URL_TTL_SECONDS
        value: "900"
