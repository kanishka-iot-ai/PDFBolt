# ==============================================================================
# Render Infrastructure Blueprint for PDFBolt Production
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Static Site (React 19 / Vite)
  # ----------------------------------------------------------------------------
  - type: web
    name: pdfbolt-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
