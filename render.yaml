# ==============================================================================
# Render Infrastructure Blueprint for PDFBolt Production
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Static Site (React 19 / Vite)
  # ----------------------------------------------------------------------------
  - type: web
    name: pdfbolt-web
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # 301 Canonical Trailing-Slash Redirects (Ensures Prerendered HTML is Served on Render)
      - type: redirect
        source: /merge-pdf
        destination: /merge-pdf/
      - type: redirect
        source: /split-pdf
        destination: /split-pdf/
      - type: redirect
        source: /compress-pdf
        destination: /compress-pdf/
      - type: redirect
        source: /pdf-to-word
        destination: /pdf-to-word/
      - type: redirect
        source: /pdf-to-excel
        destination: /pdf-to-excel/
      - type: redirect
        source: /pdf-to-ppt
        destination: /pdf-to-ppt/
      - type: redirect
        source: /pdf-to-jpg
        destination: /pdf-to-jpg/
      - type: redirect
        source: /word-to-pdf
        destination: /word-to-pdf/
      - type: redirect
        source: /excel-to-pdf
        destination: /excel-to-pdf/
      - type: redirect
        source: /ppt-to-pdf
        destination: /ppt-to-pdf/
      - type: redirect
        source: /jpg-to-pdf
        destination: /jpg-to-pdf/
      - type: redirect
        source: /html-to-pdf
        destination: /html-to-pdf/
      - type: redirect
        source: /edit-pdf
        destination: /edit-pdf/
      - type: redirect
        source: /protect-pdf
        destination: /protect-pdf/
      - type: redirect
        source: /unlock-pdf
        destination: /unlock-pdf/
      - type: redirect
        source: /sign-pdf
        destination: /sign-pdf/
      - type: redirect
        source: /redact-pdf
        destination: /redact-pdf/
      - type: redirect
        source: /ocr-pdf
        destination: /ocr-pdf/
      - type: redirect
        source: /scan-to-pdf
        destination: /scan-to-pdf/
      - type: redirect
        source: /scan-handwriting-to-pdf
        destination: /scan-handwriting-to-pdf/
      - type: redirect
        source: /rotate-pdf
        destination: /rotate-pdf/
      - type: redirect
        source: /organize-pdf
        destination: /organize-pdf/
      - type: redirect
        source: /add-page-numbers-to-pdf
        destination: /add-page-numbers-to-pdf/
      - type: redirect
        source: /watermark-pdf
        destination: /watermark-pdf/
      - type: redirect
        source: /delete-pdf-pages
        destination: /delete-pdf-pages/
      - type: redirect
        source: /compare-pdf
        destination: /compare-pdf/
      - type: redirect
        source: /repair-pdf
        destination: /repair-pdf/
      - type: redirect
        source: /pdf-to-qr-code
        destination: /pdf-to-qr-code/
      - type: redirect
        source: /analyze-pdf
        destination: /analyze-pdf/
      - type: redirect
        source: /tools
        destination: /tools/
      - type: redirect
        source: /guides
        destination: /guides/
      - type: redirect
        source: /encyclopedia
        destination: /encyclopedia/
      - type: redirect
        source: /student-pdf-tools
        destination: /student-pdf-tools/
      - type: redirect
        source: /business-pdf-tools
        destination: /business-pdf-tools/
      - type: redirect
        source: /developer-pdf-tools
        destination: /developer-pdf-tools/
      - type: redirect
        source: /compare/online-pdf-tools
        destination: /compare/online-pdf-tools/
      - type: redirect
        source: /tools/pdf-size-calculator
        destination: /tools/pdf-size-calculator/
      - type: redirect
        source: /test-files
        destination: /test-files/
      - type: redirect
        source: /about
        destination: /about/
      - type: redirect
        source: /privacy
        destination: /privacy/
      - type: redirect
        source: /terms
        destination: /terms/
      - type: redirect
        source: /contact
        destination: /contact/
      - type: redirect
        source: /cookies
        destination: /cookies/
      - type: redirect
        source: /offline-mode
        destination: /offline-mode/
      # Fallback SPA rewrite for dynamic routes
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        value: https://pdfbolt-api.onrender.com
      - key: VITE_API_BASE_URL
        value: https://pdfbolt-api.onrender.com
      - key: VITE_APP_ENV
        value: production
      - key: VITE_ADS_ENABLED
        value: "false"

  # ----------------------------------------------------------------------------
  # 2. Backend Processing Engine (FastAPI Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: pdfbolt-api
    env: docker
    dockerfilePath: ./Dockerfile.api
    region: oregon
    plan: free
    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: STORAGE_BACKEND
        value: local
      - key: CORS_ORIGINS
        value: '["https://pdfbolt.in","https://www.pdfbolt.in","https://pdfbolt.com","https://www.pdfbolt.com","https://pdfbolt.onrender.com","https://pdfbolt-web.onrender.com"]'
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "104857600"
      - key: PROCESSING_FILE_TTL_SECONDS
        value: "900"
      - key: HARD_SAFETY_TTL_SECONDS
        value: "1200"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "300"
      - key: SIGNED_URL_TTL_SECONDS
        value: "900"

