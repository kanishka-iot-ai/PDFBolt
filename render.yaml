# ==============================================================================
# Render Infrastructure Blueprint for PDFBolt Production
# Frontend has been shifted to Cloudflare Pages (https://pdfbolt.pages.dev / https://pdfbolt.in)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Backend Processing Engine (FastAPI Docker)
  # ----------------------------------------------------------------------------
  - type: web
    name: pdfbolt-api
    env: docker
    dockerfilePath: ./Dockerfile.api
    region: oregon
    plan: free
    healthCheckPath: /health

    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: STORAGE_BACKEND
        value: local
      - key: CORS_ORIGINS
        value: '["https://pdfbolt.in","https://www.pdfbolt.in","https://pdfbolt.com","https://www.pdfbolt.com","https://pdfbolt.onrender.com","https://pdfbolt-web.onrender.com","https://pdfbolt-eo3.pages.dev"]'
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "104857600"
      - key: PROCESSING_FILE_TTL_SECONDS
        value: "900"
      - key: HARD_SAFETY_TTL_SECONDS
        value: "1200"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "300"
      - key: SIGNED_URL_TTL_SECONDS
        value: "900"
      - key: RENDER_EXTERNAL_URL
        value: https://pdfbolt-api.onrender.com
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: PYTHONMALLOC
        value: "malloc"
      - key: REQUIRE_API_KEY_FOR_EXTERNAL
        value: "true"
      - key: ADMIN_PORTAL_PASSWORD
        value: "Kkds@cuchd.in"
      - key: ADMIN_TOKEN_SECRET
        value: "pdfbolt_admin_hmac_secret_key_8849f2b901a"
